<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: transparent; overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none;
    }
    am-lyrics {
      /* Colores base — warm off-white, no morado */
      --am-lyrics-highlight-color: #f6f4ef;
      --lyplus-active-color: #f6f4ef;
      --lyplus-text-color: rgba(246, 244, 239, 0.08);

      /* Mapeo a los nombres REALES del componente: --lyplus-active-color
         y --lyplus-text-color de arriba no los consume am-lyrics. Estos
         dos sí: --lyplus-text-primary (activo) y --lyplus-text-secondary
         (inactivo al 8 % como en Monochrome; el default del :host es
         color-mix al 55 %). */
      --lyplus-text-primary: #f6f4ef;
      --lyplus-text-secondary: rgba(246, 244, 239, 0.08);

      /* Tipografía responsiva */
      --lyplus-font-size-base: clamp(34px, 3vw, 52px);
      --lyplus-padding-line: 8px;

      /* Blur de letras inactivas — efecto firma de Monochrome */
      --lyplus-blur-amount: 0.16em;
      --lyplus-blur-amount-near: 0.085em;

      /* Layout */
      --lyrics-scroll-padding-top: 18%;

      /* Escala y glow suaves para no romper el look */
      --am-lyrics-highlight-radius: 8px;
      --am-lyrics-glow-radius: 2px;
      --am-lyrics-inactive-scale: 0.96;
      --am-lyrics-progression-feather: 20px;

      /* Base del contenedor */
      line-height: 1.32;
      letter-spacing: -0.04em;
      isolation: isolate;
      height: 100%;
      width: 100%;
    }
  </style>
  <!-- Script CLASICO. NO usar type="module": los modulos ES no cargan
       desde origin file:// en Android WebView. -->
  <script src="./am-lyrics.iife.js"></script>
</head>
<body>
  <!-- Blur activo: el estilo Monochrome aplica blur a las letras
       inactivas (efecto firma). no-blur NO va aquí ni en Dart. -->
  <am-lyrics autoscroll interpolate no-blur></am-lyrics>

  <script>
    // Loop de interpolación de tiempo DENTRO del WebView.
    // Dart solo empuja updates cada ~250ms. Este loop interpola
    // con requestAnimationFrame entre updates, sin cruzar el
    // puente en cada frame.
    (function() {
      const el = document.querySelector('am-lyrics');

      let baseMs = 0;    // Tiempo base (recibido de Dart)
      let basePerf = 0;  // performance.now() cuando se recibió
      let playing = false;
      let rafId = null;

      function tick() {
        if (!playing) {
          rafId = null;
          return;
        }
        const now = performance.now();
        const elapsed = now - basePerf;
        el.currentTime = baseMs + elapsed;
        rafId = requestAnimationFrame(tick);
      }

      function startLoop() {
        if (rafId !== null) return;
        basePerf = performance.now();
        rafId = requestAnimationFrame(tick);
      }

      function stopLoop() {
        if (rafId !== null) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
      }

      // Exuesto para que Dart lo llame vía runJavaScript.
      // Llamar cada ~250ms durante reproducción. NO cada frame.
      window.__setLyricsTime = function(ms, isPlaying) {
        baseMs = ms;
        basePerf = performance.now();
        el.currentTime = ms;

        if (isPlaying && !playing) {
          playing = true;
          startLoop();
        } else if (!isPlaying && playing) {
          playing = false;
          stopLoop();
        }
        // Si no está playing: actualización puntual (seek, pause),
        // no se arranca loop.
      };

      // Ajuste manual de offset. Persistido desde Dart.
      window.__setLyricsOffset = function(offsetMs) {
        // El offset se aplica restando al tiempo que Dart envía.
        // Se guarda para la próxima vez que Dart llame __setLyricsTime.
        window.__lyricsOffsetMs = offsetMs;
      };
    })();
  </script>
</body>
</html>
