<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    /* NO usar contain: strict en html/body. contain: size hace que el
       contenedor tenga tamaño intrínseco 0x0 y rompe el layout de todo
       lo que esté dentro. */
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: transparent; overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none;
    }
    am-lyrics {
      position: relative;
      height: 100%;
      width: 100%;
      /* El color del texto sale de --lyplus-text-primary =
         --am-lyrics-highlight-color: blanco puro. La escalera de
         opacidades la pone el CSS que Dart inyecta en el shadowRoot. */
      --am-lyrics-highlight-color: #ffffff;
      --lyrics-scroll-padding-top: 30%;
      --lyplus-font-size-base: clamp(36px, 3.4vw, 56px);
      --lyplus-padding-line: 10px;
      /* Blur interno de am-lyrics anulado: el unico blur visible es
         el que inyecta Dart en el shadowRoot (coste acotado) y en
         gama baja lo apaga :host([data-tier="low"]). */
      --lyplus-blur-amount: 0 !important;
      --lyplus-blur-amount-near: 0 !important;
      line-height: 1.2;
      letter-spacing: -0.025em;
      isolation: isolate;
      font-weight: 700;
    }
  </style>
  <!-- Puente de salida. En el WebView nativo webview_flutter inyecta el
       canal JS `AmLyricsBridge` antes de cargar la pagina; en la iframe
       web del host no existe, asi que este shim reenvia los mensajes al
       host: canal primario un CustomEvent `metmusic-lyrics` despachado
       en el `document` del padre (misma origen, sin MessageEvents) y
       fallback postMessage. -->
  <script>
    if (typeof window.AmLyricsBridge === 'undefined') {
      window.AmLyricsBridge = {
        postMessage: function(message) {
          try {
            window.parent.document.dispatchEvent(
              new CustomEvent('metmusic-lyrics', { detail: message })
            );
          } catch (e) {
            try { window.parent.postMessage(message, '*'); } catch (e2) {}
          }
        }
      };
    }
  </script>
  <!-- Script CLASICO. NO usar type="module": los modulos ES no cargan
       desde origin file:// en Android WebView. -->
  <script src="./am-lyrics.iife.js"></script>
</head>
<body>
  <!-- no-blur anula el sistema de blur NATIVO del componente (reglas
       internas, ventana prev/next-N, JS progresivo): todo el coste
       queda en el CSS que Dart inyecta en el shadowRoot (blur solo en
       pre-active; en gama baja lo apaga data-tier="low"). interpolate
       lo decide el script de abajo (isLowEnd). -->
  <am-lyrics autoscroll interpolate no-blur></am-lyrics>

  <script>
    // Loop de interpolacion de tiempo DENTRO del WebView.
    // Dart solo empuja updates cada ~250ms. Este loop interpola
    // con requestAnimationFrame entre updates, sin cruzar el
    // puente en cada frame.
    (function() {
      const el = document.querySelector('am-lyrics');

      const cores = navigator.hardwareConcurrency || 4;
      const mem = navigator.deviceMemory || 4;

      // Gama baja: pocos nucleos o poca RAM -> interpolate OFF.
      // El default de Lit es true: hay que QUITAR el atributo (el
      // callback post-upgrade lo pone a false) Y forzar la propiedad,
      // que es lo que dejo probado la Task 4.
      const isLowEnd = cores <= 4 || mem <= 2;
      window.__deviceTier = isLowEnd ? 'low' : 'high';
      // El CSS inyectado apaga el blur de la pre-active en gama baja.
      el.setAttribute('data-tier', window.__deviceTier);

      function log(msg) {
        try {
          AmLyricsBridge.postMessage(JSON.stringify({ type: 'debug', message: msg }));
        } catch (e) {}
      }
      log('device tier: ' + window.__deviceTier + ' cores=' + cores + ' mem=' + mem);

      if (isLowEnd) {
        el.removeAttribute('interpolate');
        el.interpolate = false;
      }

      // Throttle a 30fps: el rAF sigue a cadencia de pantalla, pero
      // currentTime solo se escribe 30 veces por segundo (cada write
      // invalida estilos y dispara recalculo). Mantiene el coste
      // bajo con o sin blur.
      const FRAME_INTERVAL = 1000 / 30;
      let baseMs = 0;
      let basePerf = 0;
      let playing = false;
      let rafId = null;
      let lastFrameTime = 0;

      function tick(now) {
        if (!playing) {
          rafId = null;
          return;
        }
        if (now - lastFrameTime >= FRAME_INTERVAL) {
          lastFrameTime = now;
          el.currentTime = baseMs + (now - basePerf);
        }
        rafId = requestAnimationFrame(tick);
      }

      function startLoop() {
        if (rafId !== null) return;
        basePerf = performance.now();
        lastFrameTime = 0;
        rafId = requestAnimationFrame(tick);
      }

      function stopLoop() {
        if (rafId !== null) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
      }

      // Expuesto para que Dart lo llame via runJavaScript.
      // Llamar cada ~250ms durante reproduccion. NO cada frame.
      window.__setLyricsTime = function(ms, isPlaying) {
        baseMs = ms;
        basePerf = performance.now();
        el.currentTime = ms;

        if (isPlaying && !playing) {
          playing = true;
          startLoop();
        } else if (!isPlaying && playing) {
          playing = false;
          stopLoop();
        }
        // Si no esta playing: actualizacion puntual (seek, pause),
        // no se arranca loop.
      };

      // Inyecta CSS en el shadowRoot de am-lyrics (patron Monochrome:
      // applyFullscreenLyricsShadowTweaks). querySelector en vez de
      // getElementById: no todos los shadow roots exponen getElementById.
      // Si el shadowRoot todavia no existe (upgrade de Lit pendiente) se
      // reintenta: inyectar en light DOM no aplicaria a nada.
      let pendingLyricsCss = null;
      let lyricsCssTries = 0;
      function applyLyricsCss() {
        if (pendingLyricsCss === null) return;
        const root = el.shadowRoot;
        if (!root) {
          if (lyricsCssTries < 20) {
            lyricsCssTries++;
            setTimeout(applyLyricsCss, 50);
          }
          return;
        }
        lyricsCssTries = 0;
        let s = root.querySelector('#metmusic-lyrics-style');
        if (!s) {
          s = document.createElement('style');
          s.id = 'metmusic-lyrics-style';
          root.appendChild(s);
        }
        s.textContent = pendingLyricsCss;
      }
      window.__injectLyricsStyle = function(css) {
        pendingLyricsCss = css;
        applyLyricsCss();
      };

      // Configuracion compartida entre el WebView nativo (Dart la llama
      // por runJavaScript) y el host web (llega por postMessage). Vive
      // aca para no duplicar la logica de atributos y eventos.
      window.__configureAmLyrics = function(opts) {
        customElements.whenDefined('am-lyrics').then(() => {
          const report = (type, message) => {
            AmLyricsBridge.postMessage(JSON.stringify({
              type: type, message: message
            }));
          };
          report('debug', 'am-lyrics custom element defined');
          const target = document.querySelector('am-lyrics');
          if (!target) {
            AmLyricsBridge.postMessage(JSON.stringify({
              type: 'error',
              message: 'am-lyrics element not in DOM'
            }));
            return;
          }
          target.setAttribute('track-id', opts.trackId);
          target.setAttribute('api-base', opts.apiBase);
          target.setAttribute('api-token', opts.apiToken);
          target.setAttribute('highlight-color', opts.highlightColor);
          target.setAttribute('autoscroll', '');
          // interpolate lo decide este script (logica isLowEnd): no se
          // toca aqui, si no se re-encenderia en gama baja.
          if (opts.noBlur) {
            target.setAttribute('no-blur', '');
          } else {
            // Toggle real: el HTML lo trae por defecto, asi que para
            // poder volver a blur hay que quitar el atributo.
            target.removeAttribute('no-blur');
          }
          target.addEventListener('line-click', (e) => {
            AmLyricsBridge.postMessage(JSON.stringify({
              type: 'line-click',
              timestamp: e.detail.timestamp
            }));
          });
          window.__amLyrics = target;
          AmLyricsBridge.postMessage(JSON.stringify({ type: 'ready' }));
        }).catch((err) => {
          AmLyricsBridge.postMessage(JSON.stringify({
            type: 'error',
            message: 'whenDefined failed: ' + String(err)
          }));
        });
      };

      // Puente de entrada del host web (iframe): Dart manda configure /
      // time / style por postMessage como JSON string. El WebView nativo
      // no pasa por aca: llama a las funciones directamente.
      window.addEventListener('message', function(e) {
        if (typeof e.data !== 'string') return;
        let d;
        try { d = JSON.parse(e.data); } catch (err) { return; }
        if (!d || d.__metmusic !== true) return;
        switch (d.type) {
          case 'configure':
            window.__configureAmLyrics(d);
            break;
          case 'time':
            window.__setLyricsTime(d.ms, d.playing);
            break;
          case 'style':
            window.__injectLyricsStyle(d.css);
            break;
        }
      });
    })();
  </script>
</body>
</html>
