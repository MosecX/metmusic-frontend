<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: transparent; overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none;
    }
    am-lyrics {
      /* Colores base — warm off-white, no morado (look Monochrome) */
      --am-lyrics-highlight-color: #f6f4ef;
      --lyplus-active-color: #f6f4ef;
      --lyplus-text-color: rgba(246, 244, 239, 0.08);

      /* Mapeo a los nombres REALES del componente: --lyplus-active-color
         y --lyplus-text-color de arriba no los consume am-lyrics. Estos
         dos sí: --lyplus-text-primary (activo) y --lyplus-text-secondary
         (inactivo al 8 % como en Monochrome; el default del :host es
         color-mix al 55 %). */
      --lyplus-text-primary: #f6f4ef;
      --lyplus-text-secondary: rgba(246, 244, 239, 0.08);

      /* Tipografía responsiva */
      --lyplus-font-size-base: clamp(34px, 3vw, 52px);
      --lyplus-padding-line: 8px;

      /* Blur de letras inactivas — efecto firma de Monochrome */
      --lyplus-blur-amount: 0.16em;
      --lyplus-blur-amount-near: 0.085em;

      /* Layout */
      --lyrics-scroll-padding-top: 18%;

      /* Escala y glow suaves para no romper el look */
      --am-lyrics-highlight-radius: 8px;
      --am-lyrics-glow-radius: 2px;
      --am-lyrics-inactive-scale: 0.96;
      --am-lyrics-progression-feather: 20px;

      /* Base del contenedor */
      line-height: 1.32;
      letter-spacing: -0.04em;
      isolation: isolate;
      height: 100%;
      width: 100%;
    }
  </style>
  <!-- Script CLASICO. NO usar type="module": los modulos ES no cargan
       desde origin file:// en Android WebView. -->
  <script src="./am-lyrics.iife.js"></script>
</head>
<body>
  <!-- Visualizer Kawarp (Monochrome): canvas fullscreen DETRAS de las
       letras. z-index:-1 porque un position:fixed con z-index:0 pintaria
       POR ENCIMA del contenido estatico de am-lyrics. Arranca oculto:
       solo lo muestra Dart en modo visualizer. -->
  <canvas id="kawarp-canvas"
          style="position:fixed; inset:0; z-index:-1; pointer-events:none; display:none;"></canvas>

  <!-- Blur desactivado: optimizacion de rendimiento para gama baja
       (se puede togglear desde Dart via noBlur). -->
  <am-lyrics autoscroll interpolate no-blur></am-lyrics>

  <!-- @kawarp/core empaquetado como IIFE: expone window.Kawarp. -->
  <script src="./kawarp-core.js"></script>
  <script src="./kawarp.js"></script>

  <script>
    // Loop de interpolacion de tiempo DENTRO del WebView.
    // Dart solo empuja updates cada ~250ms. Este loop interpola
    // con requestAnimationFrame entre updates, sin cruzar el
    // puente en cada frame.
    (function() {
      const el = document.querySelector('am-lyrics');

      let baseMs = 0;    // Tiempo base (recibido de Dart)
      let basePerf = 0;  // performance.now() cuando se recibio
      let playing = false;
      let rafId = null;

      function tick() {
        if (!playing) {
          rafId = null;
          return;
        }
        const now = performance.now();
        const elapsed = now - basePerf;
        el.currentTime = baseMs + elapsed;
        rafId = requestAnimationFrame(tick);
      }

      function startLoop() {
        if (rafId !== null) return;
        basePerf = performance.now();
        rafId = requestAnimationFrame(tick);
      }

      function stopLoop() {
        if (rafId !== null) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
      }

      // Expuesto para que Dart lo llame via runJavaScript.
      // Llamar cada ~250ms durante reproduccion. NO cada frame.
      window.__setLyricsTime = function(ms, isPlaying) {
        baseMs = ms;
        basePerf = performance.now();
        el.currentTime = ms;

        if (isPlaying && !playing) {
          playing = true;
          startLoop();
        } else if (!isPlaying && playing) {
          playing = false;
          stopLoop();
        }
        // Si no esta playing: actualizacion puntual (seek, pause),
        // no se arranca loop.
      };

      // Inyecta CSS en el shadowRoot de am-lyrics (patron Monochrome:
      // applyFullscreenLyricsShadowTweaks).
      window.__injectLyricsStyle = function(css) {
        const root = el.shadowRoot || el;
        // querySelector en vez de getElementById: no todos los
        // shadow roots exponen getElementById.
        let s = root.querySelector('#metmusic-lyrics-style');
        if (!s) {
          s = document.createElement('style');
          s.id = 'metmusic-lyrics-style';
          root.appendChild(s);
        }
        s.textContent = css;
      };
    })();

    // ---- Visualizer Kawarp: control desde Dart ----

    window.__setVisualizerCover = function(url) {
      const vis = window.__kawarpVisualizer;
      // Sin check de isInitialized: loadCover encola el cover si el
      // visualizer aun no existe y lo aplica al terminar el init.
      if (vis) vis.loadCover(url);
    };

    window.__initVisualizer = function() {
      const canvas = document.getElementById('kawarp-canvas');
      if (canvas && window.__kawarpVisualizer) {
        window.__kawarpVisualizer.init(canvas);
      }
    };

    window.__setVisualizerEnabled = function(enabled) {
      const canvas = document.getElementById('kawarp-canvas');
      if (!canvas) return;
      canvas.style.display = enabled ? 'block' : 'none';
      const vis = window.__kawarpVisualizer;
      if (!vis) return;
      if (enabled) {
        vis.init(canvas);            // idempotente
        if (vis.kawarp) vis.kawarp.start();
      } else if (vis.kawarp) {
        // Oculto: parar el rAF de WebGL para no gastar GPU en gama baja.
        vis.kawarp.stop();
      }
    };
  </script>
</body>
</html>
