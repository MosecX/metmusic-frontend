<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    /* NO usar contain: strict en html/body. contain: size hace que el
       contenedor tenga tamaño intrínseco 0x0 y rompe el layout de todo
       lo que esté dentro, incluido el canvas fullscreen. */
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: transparent; overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none;
    }
    #kawarp-canvas {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 0;
      pointer-events: none;
      display: block;
      margin: 0; padding: 0;
    }
    am-lyrics {
      position: relative;
      z-index: 1;
      height: 100%;
      width: 100%;
      --am-lyrics-highlight-color: #ffffff;
      --lyrics-scroll-padding-top: 30%;
      --lyplus-font-size-base: clamp(36px, 3.4vw, 56px);
      --lyplus-padding-line: 10px;
      --lyplus-text-color: rgba(255, 255, 255, 0.42);
      --lyplus-active-color: #ffffff;
      /* Blur interno de am-lyrics anulado: el unico blur visible es
         el que inyecta Dart en el shadowRoot (coste acotado). */
      --lyplus-blur-amount: 0 !important;
      --lyplus-blur-amount-near: 0 !important;
      line-height: 1.28;
      letter-spacing: -0.025em;
      isolation: isolate;
      font-weight: 600;
    }
  </style>
  <!-- Script CLASICO. NO usar type="module": los modulos ES no cargan
       desde origin file:// en Android WebView. -->
  <script src="./am-lyrics.iife.js"></script>
</head>
<body>
  <!-- Visualizer Kawarp (Monochrome): canvas fullscreen DETRAS de las
       letras (regla #kawarp-canvas con z-index:0 + am-lyrics z-index:1).
       Sin style inline: lo gobierna la regla CSS. No dibuja nada hasta
       que Dart llama init; en modo estandar Dart lo oculta al arrancar. -->
  <canvas id="kawarp-canvas"></canvas>

  <!-- no-blur anula el sistema de blur NATIVO del componente (reglas
       internas, ventana prev/next-N, JS progresivo): todo el coste
       queda en el CSS que Dart inyecta en el shadowRoot (blur solo en
       pre-active). interpolate lo decide el script de abajo (isLowEnd). -->
  <am-lyrics autoscroll interpolate no-blur></am-lyrics>

  <!-- @kawarp/core empaquetado como IIFE: expone window.Kawarp. -->
  <script src="./kawarp-core.js"></script>
  <script src="./kawarp.js"></script>

  <script>
    // Loop de interpolacion de tiempo DENTRO del WebView.
    // Dart solo empuja updates cada ~250ms. Este loop interpola
    // con requestAnimationFrame entre updates, sin cruzar el
    // puente en cada frame.
    (function() {
      const el = document.querySelector('am-lyrics');

      const cores = navigator.hardwareConcurrency || 4;
      const mem = navigator.deviceMemory || 4;

      // Gama baja: pocos nucleos o poca RAM -> interpolate OFF.
      // El default de Lit es true: hay que QUITAR el atributo (el
      // callback post-upgrade lo pone a false) Y forzar la propiedad,
      // que es lo que dejo probado la Task 4.
      const isLowEnd = cores <= 4 || mem <= 2;
      window.__deviceTier = isLowEnd ? 'low' : 'high';

      function log(msg) {
        try {
          AmLyricsBridge.postMessage(JSON.stringify({ type: 'debug', message: msg }));
        } catch (e) {}
      }
      log('device tier: ' + window.__deviceTier + ' cores=' + cores + ' mem=' + mem);

      if (isLowEnd) {
        el.removeAttribute('interpolate');
        el.interpolate = false;
      }

      // Throttle a 30fps: el rAF sigue a cadencia de pantalla, pero
      // currentTime solo se escribe 30 veces por segundo (cada write
      // invalida estilos y dispara recalculo). Mantiene el coste
      // bajo con o sin blur.
      const FRAME_INTERVAL = 1000 / 30;
      let baseMs = 0;
      let basePerf = 0;
      let playing = false;
      let rafId = null;
      let lastFrameTime = 0;

      function tick(now) {
        if (!playing) {
          rafId = null;
          return;
        }
        if (now - lastFrameTime >= FRAME_INTERVAL) {
          lastFrameTime = now;
          el.currentTime = baseMs + (now - basePerf);
        }
        rafId = requestAnimationFrame(tick);
      }

      function startLoop() {
        if (rafId !== null) return;
        basePerf = performance.now();
        lastFrameTime = 0;
        rafId = requestAnimationFrame(tick);
      }

      function stopLoop() {
        if (rafId !== null) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
      }

      // Expuesto para que Dart lo llame via runJavaScript.
      // Llamar cada ~250ms durante reproduccion. NO cada frame.
      window.__setLyricsTime = function(ms, isPlaying) {
        baseMs = ms;
        basePerf = performance.now();
        el.currentTime = ms;

        if (isPlaying && !playing) {
          playing = true;
          startLoop();
        } else if (!isPlaying && playing) {
          playing = false;
          stopLoop();
        }
        // Si no esta playing: actualizacion puntual (seek, pause),
        // no se arranca loop.
      };

      // Inyecta CSS en el shadowRoot de am-lyrics (patron Monochrome:
      // applyFullscreenLyricsShadowTweaks). querySelector en vez de
      // getElementById: no todos los shadow roots exponen getElementById.
      window.__injectLyricsStyle = function(css) {
        const root = el.shadowRoot || el;
        let s = root.querySelector('#metmusic-lyrics-style');
        if (!s) {
          s = document.createElement('style');
          s.id = 'metmusic-lyrics-style';
          root.appendChild(s);
        }
        s.textContent = css;
      };

      // --- Debug del canvas Kawarp ---
      window.__syncKawarpSize = function() {
        const canvas = document.getElementById('kawarp-canvas');
        if (!canvas) {
          log('kawarp canvas missing');
          return;
        }
        const w = window.innerWidth;
        const h = window.innerHeight;
        const dpr = window.devicePixelRatio || 1;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        const rect = canvas.getBoundingClientRect();
        log('kawarp size: viewport=' + w + 'x' + h +
            ' buffer=' + canvas.width + 'x' + canvas.height +
            ' rect=' + Math.round(rect.width) + 'x' + Math.round(rect.height) +
            ' dpr=' + dpr);
        const vis = window.__kawarpVisualizer;
        if (vis && vis.kawarp && typeof vis.kawarp.resize === 'function') {
          try {
            vis.kawarp.resize(w, h);
            log('kawarp.resize called');
          } catch (e) {
            log('kawarp.resize error: ' + e);
          }
        }
      };
      window.addEventListener('resize', window.__syncKawarpSize);
      window.addEventListener('orientationchange', function() {
        setTimeout(window.__syncKawarpSize, 150);
      });
      window.addEventListener('load', function() {
        setTimeout(window.__syncKawarpSize, 200);
      });
    })();

    // ---- Visualizer Kawarp: control desde Dart ----

    window.__setVisualizerCover = function(url) {
      const vis = window.__kawarpVisualizer;
      // Sin check de isInitialized: loadCover encola el cover si el
      // visualizer aun no existe y lo aplica al terminar el init.
      if (vis) vis.loadCover(url);
    };

    window.__initVisualizer = function() {
      const canvas = document.getElementById('kawarp-canvas');
      if (canvas && window.__kawarpVisualizer) {
        window.__kawarpVisualizer.init(canvas);
      }
    };

    window.__setVisualizerEnabled = function(enabled) {
      const canvas = document.getElementById('kawarp-canvas');
      if (!canvas) return;
      canvas.style.display = enabled ? 'block' : 'none';
      const vis = window.__kawarpVisualizer;
      if (!vis) return;
      if (enabled) {
        vis.init(canvas);            // idempotente
        if (vis.kawarp) vis.kawarp.start();
      } else if (vis.kawarp) {
        // Oculto: parar el rAF de WebGL para no gastar GPU en gama baja.
        vis.kawarp.stop();
      }
    };
  </script>
</body>
</html>
