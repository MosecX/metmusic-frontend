# Memoria del daemon, caché y ejecución en paralelo.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX y R no transitivo.
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 8.7.x todavía no conoce compileSdk 36 (decisión del proyecto: 36, igual
# que la build Flutter); se silencia el aviso de versión no probada.
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official

# Versionado de la app. El CI pasa -Pmetmusic.versionCode con el número de run
# para subir el versionCode en cada corrida: así el teléfono acepta la
# actualización sobre la build instalada.
metmusic.versionCode=1
metmusic.versionName=0.1.0-native
