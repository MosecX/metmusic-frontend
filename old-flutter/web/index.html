<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    Si la app se sirve desde una ruta distinta de la raíz, cambiar el href
    de abajo para reflejar la ruta base. El valor de reemplazo lo pone
    `flutter build --base-href`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description"
        content="MetMusic — reproductor de música con letras sincronizadas (Tidal metadata + Qobuz stream).">

  <!-- iOS / PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MetMusic">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MetMusic</title>
  <link rel="manifest" href="manifest.json">

  <!-- Fondo negro desde el primer byte: sin flash blanco mientras
       Flutter arranca. -->
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000000;
      overscroll-behavior: none;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
