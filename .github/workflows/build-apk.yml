name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # El proyecto usa APIs de Flutter >= 3.41 (por ejemplo
  # ReorderableListView.onReorderItem). Verificado con 3.47.5.
  FLUTTER_VERSION: '3.47.x'

jobs:
  build:
    name: Analyze, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

      # App privada: sólo APK, uno por ABI (arm64-v8a, armeabi-v7a, x86_64).
      # `--build-number` sube el versionCode en cada corrida: así el teléfono
      # acepta la actualización encima de la que ya tiene instalada.
      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      # Si la firma no fuera la del keystore versionado en el repo, Android
      # rechazaría la actualización (UPDATE_INCOMPATIBLE) y habría que
      # desinstalar la app: mejor que el build falle acá.
      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          for apk in build/app/outputs/flutter-apk/*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk" | grep -E "SHA-256|DN:"
          done

      # Vía primaria: sube los APKs a GitHub Artifacts (gratis dentro de
      # la cuota de GitHub). `continue-on-error` evita que el workflow
      # aborte si el upload falla (límite de 500 MB, cuota de storage…):
      # el step termina con outcome = 'failure' y se evalúa el fallback
      # del paso siguiente.
      - name: Upload APK artifacts
        id: apk_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # Fallback: sube los APKs al repo CDN SOLO si el upload a Artifacts
      # falló (outcome == 'failure') y sólo en push (no en PRs). El script
      # no cambia: el build usa --split-per-abi, así que hay un APK por ABI
      # en la carpeta versionada y en latest/. El commit lleva [skip ci]
      # para no detonar el workflow del repo CDN.
      - name: Publish APK to CDN repo
        if: github.event_name == 'push' && steps.apk_artifact.outcome == 'failure'
        env:
          CDN_TOKEN: ${{ secrets.CDN_TOKEN }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          SHORT_SHA=$(git rev-parse --short HEAD)
          git clone --depth 1 "https://x-access-token:${CDN_TOKEN}@github.com/MosecX/cdn.tinvoxdevelopment.git" cdn-repo
          cd cdn-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "metmusic/${VERSION}-${SHORT_SHA}" metmusic/latest
          for apk in ../build/app/outputs/flutter-apk/*.apk; do
            name=$(basename "$apk")
            abi_name="${name#app-}"
            cp "$apk" "metmusic/${VERSION}-${SHORT_SHA}/MetMusic-${VERSION}-${SHORT_SHA}-${abi_name}"
            cp "$apk" "metmusic/latest/MetMusic-${abi_name}"
          done
          git add metmusic
          git diff --cached --quiet || git commit -m "MetMusic APK ${VERSION} (${SHORT_SHA}) [skip ci]"
          git push

      # Diagnóstico en el summary del run: qué camino se tomó y por qué.
      - name: Report artifact status
        if: always()
        run: |
          OUTCOME="${{ steps.apk_artifact.outcome }}"
          echo "## APK Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact upload outcome: $OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" = "success" ]; then
            echo "- Published to: GitHub Artifacts" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "- Published to: CDN (Artifacts failed)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Not published (build ended before upload: $OUTCOME)" >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: apk-release/*.apk