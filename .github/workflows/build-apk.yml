name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # El proyecto usa APIs de Flutter >= 3.41 (por ejemplo
  # ReorderableListView.onReorderItem). Verificado con 3.47.5.
  FLUTTER_VERSION: '3.47.x'

jobs:
  build:
    name: Analyze, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

      # App privada: sólo APK, uno por ABI (arm64-v8a, armeabi-v7a, x86_64).
      # `--build-number` sube el versionCode en cada corrida: así el teléfono
      # acepta la actualización encima de la que ya tiene instalada.
      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      # Si la firma no fuera la del keystore versionado en el repo, Android
      # rechazaría la actualización (UPDATE_INCOMPATIBLE) y habría que
      # desinstalar la app: mejor que el build falle acá.
      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          for apk in build/app/outputs/flutter-apk/*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk" | grep -E "SHA-256|DN:"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: apk-release/*.apk